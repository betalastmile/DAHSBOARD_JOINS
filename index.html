 $('tb').innerHTML=[['res','Resumen'],['pat','🔎 Análisis'],['ref','Referidores'],['sp','Sucursal · Puesto'],['pag','Pagos'],['det','Detalle']].map(([k,l])=>`<button data-t="${k}" onclick="TAB='${k}';R()">${l}</button>`).join('');R()}

async function pdf(todas){const bs=document.querySelectorAll('.pb'),btn=bs[todas?1:0],tx=btn.textContent,tab0=TAB,th0=document.documentElement.dataset.theme;bs.forEach(b=>b.disabled=true);

 doc.save('dashboard_referidos_'+new Date().toISOString().slice(0,10)+'.pdf')}
